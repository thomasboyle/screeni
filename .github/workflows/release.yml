name: Release

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # Maximum LZMA2 compression takes longer than the previous ZIP packaging.
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Compute next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tags = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref' 2>$null
          $parsed = @()
          foreach ($ref in $tags) {
            $t = $ref -replace '^refs/tags/v', ''
            if ($t -match '^(\d+\.\d+\.\d+)$') { $parsed += $Matches[1] }
          }
          if ($parsed.Count -gt 0) {
            $latest = $parsed | Sort-Object { [version]$_ } | Select-Object -Last 1
            $parts = $latest.Split('.')
            $next = '{0}.{1}.{2}' -f $parts[0], $parts[1], ([int]$parts[2] + 1)
          } else {
            $next = (Select-String -Path installer/ci-version.iss -Pattern '#define MyAppVersion "(.*)"').Matches[0].Groups[1].Value
          }
          "version=$next" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "#define MyAppVersion `"$next`"" | Set-Content installer/ci-version.iss -Encoding utf8NoBOM
          Write-Host "Next version: $next"

      - uses: actions/cache@v5
        id: publish-cache
        with:
          path: artifacts/ci-cache/publish
          key: publish-${{ hashFiles('src/Screeni.App/**') }}

      - uses: actions/cache@v5
        id: core-dll
        with:
          path: artifacts/ci-cache/Screeni.Core.dll
          key: core-dll-${{ hashFiles('src/Screeni.Core/**') }}

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        if: steps.core-dll.outputs.cache-hit != 'true'
        with:
          arch: x64

      - name: Build release
        shell: pwsh
        run: ./scripts/ci-release.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $installer = "artifacts/installer/ScreeniSetup-$version.exe"
          if (-not (Test-Path $installer)) { throw "Missing $installer" }
          Write-Host "Artifact OK: $installer ($([math]::Round((Get-Item $installer).Length/1MB,1)) MB)"
          gh release create $tag $installer --title "Screeni $tag" --generate-notes

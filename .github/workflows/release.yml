name: Release

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 1

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        shell: pwsh
        run: |
          git fetch --tags --force
          $parsed = git tag -l 'v*' | ForEach-Object {
            $t = $_ -replace '^v', ''
            if ($t -match '^(\d+\.\d+\.\d+)(?:-build\.\d+)?$') { $Matches[1] }
          } | Where-Object { $_ }
          if ($parsed) {
            $latest = $parsed | Sort-Object { [version]$_ } | Select-Object -Last 1
            $parts = $latest.Split('.')
            $next = '{0}.{1}.{2}' -f $parts[0], $parts[1], ([int]$parts[2] + 1)
          } else {
            $next = (Select-String -Path installer/ci-version.iss -Pattern '#define MyAppVersion "(.*)"').Matches[0].Groups[1].Value
          }
          "version=$next" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "#define MyAppVersion `"$next`"" | Set-Content installer/ci-version.iss -Encoding utf8NoBOM
          Write-Host "Next version: $next"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - uses: actions/cache@v4
        with:
          path: build/Screeni.Core
          key: core-${{ hashFiles('src/Screeni.Core/**') }}

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Build release
        shell: pwsh
        run: ./scripts/ci-release.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $installer = "artifacts/installer/ScreeniSetup-$version.exe"
          if (-not (Test-Path $installer)) { throw "Missing $installer" }
          Write-Host "Artifact OK: $installer ($([math]::Round((Get-Item $installer).Length/1MB,1)) MB)"
          gh release create $tag $installer --title "Screeni $tag" --generate-notes

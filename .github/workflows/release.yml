name: Release

on:
  push:
    branches:
      - master
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "HEAD is already tagged; skipping release."
            exit 0
          fi

          LATEST_TAG="$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1 || true)"
          if [ -n "$LATEST_TAG" ]; then
            CURRENT="${LATEST_TAG#v}"
            MAJOR="${CURRENT%%.*}"
            REST="${CURRENT#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"
            PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "Bumping ${CURRENT} -> ${NEW_VERSION}"
          else
            NEW_VERSION="$(tr -d '[:space:]' < VERSION)"
            NEW_VERSION="${NEW_VERSION:-1.0.0}"
            echo "No existing tags; releasing ${NEW_VERSION}"
          fi
          TAG="v${NEW_VERSION}"

          printf '%s\n' "$NEW_VERSION" > VERSION
          sed -i "s/#define MyAppVersion \".*\"/#define MyAppVersion \"${NEW_VERSION}\"/" installer/Screeni.iss

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION installer/Screeni.iss
          if git diff --cached --quiet; then
            echo "Version files already at ${NEW_VERSION}"
          else
            git commit -m "chore: bump version to ${NEW_VERSION}"
          fi
          git tag "$TAG"

          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "$TAG"

          gh release create "$TAG" \
            --title "Screeni ${NEW_VERSION}" \
            --generate-notes

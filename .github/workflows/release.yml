name: Release

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Compute next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tags = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref' 2>$null
          $parsed = @()
          foreach ($ref in $tags) {
            $t = $ref -replace '^refs/tags/v', ''
            if ($t -match '^(\d+\.\d+\.\d+)$') { $parsed += $Matches[1] }
          }
          if ($parsed.Count -gt 0) {
            $latest = $parsed | Sort-Object { [version]$_ } | Select-Object -Last 1
            $parts = $latest.Split('.')
            $next = '{0}.{1}.{2}' -f $parts[0], $parts[1], ([int]$parts[2] + 1)
          } else {
            $next = (Select-String -Path installer/ci-version.iss -Pattern '#define MyAppVersion "(.*)"').Matches[0].Groups[1].Value
          }
          "version=$next" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "#define MyAppVersion `"$next`"" | Set-Content installer/ci-version.iss -Encoding utf8NoBOM
          Write-Host "Next version: $next"

      # Install Qt msvc2022_64 and expose the install dir via QT_DIR.
      # Only the qtbase archive is needed (Widgets/Network + windeployqt); aqt
      # installs ~27 base archives by default, so pinning --archives qtbase
      # keeps the download and the Actions cache small.
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          archives: 'qtbase'
          cache: true
          set-env: true

      # Expose pre-installed MSVC (~2s) instead of downloading Build Tools (~70s).
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build release
        shell: pwsh
        run: ./scripts/ci-release.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $installer = "artifacts/installer/ScreeniSetup-$version.exe"
          if (-not (Test-Path $installer)) { throw "Missing $installer" }
          Write-Host "Artifact OK: $installer ($([math]::Round((Get-Item $installer).Length/1MB,1)) MB)"
          gh release create $tag $installer --title "Screeni $tag" --generate-notes
name: Release

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 1

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        shell: pwsh
        run: |
          git fetch --tags --force
          $parsed = git tag -l 'v*' | ForEach-Object {
            $t = $_ -replace '^v', ''
            if ($t -match '^(\d+\.\d+\.\d+)(?:-build\.\d+)?$') { $Matches[1] }
          } | Where-Object { $_ }
          if ($parsed) {
            $latest = $parsed | Sort-Object { [version]$_ } | Select-Object -Last 1
            $parts = $latest.Split('.')
            $next = '{0}.{1}.{2}' -f $parts[0], $parts[1], ([int]$parts[2] + 1)
          } else {
            $next = (Select-String -Path installer/ci-version.iss -Pattern '#define MyAppVersion "(.*)"').Matches[0].Groups[1].Value
          }
          "version=$next" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Next version: $next"

      - name: Set installer version
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          "#define MyAppVersion `"$version`"" | Set-Content installer/ci-version.iss -Encoding utf8NoBOM

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - uses: actions/cache@v4
        with:
          path: installer/redist
          key: wasdk-redist-1.6.250602001

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Build release
        shell: pwsh
        run: ./scripts/ci-release.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $installer = "artifacts/installer/ScreeniSetup-$version.exe"
          if (-not (Test-Path $installer)) {
            Write-Error "Installer not found: $installer"
            Get-ChildItem artifacts/installer -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "Artifact OK: $installer ($([math]::Round((Get-Item $installer).Length/1MB,1)) MB)"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Screeni v${{ steps.version.outputs.version }}
          files: artifacts/installer/ScreeniSetup-${{ steps.version.outputs.version }}.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
